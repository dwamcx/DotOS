<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DotOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body{background:#000;margin:0;width:100vw;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
/* BOOT */
#boot{position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .8s}
#boot.out{opacity:0;pointer-events:none}
.boot-logo-wrap{position:relative;width:110px;height:110px;margin-bottom:32px}
.boot-arc{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent;border-top-color:#00d4aa;border-right-color:#6c63ff;animation:bspin 1.8s linear infinite}
.boot-arc2{position:absolute;inset:10px;border-radius:50%;border:1.5px solid transparent;border-bottom-color:rgba(108,99,255,.35);animation:bspin 2.8s linear infinite reverse}
@keyframes bspin{to{transform:rotate(360deg)}}
.boot-dots{position:absolute;inset:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;align-content:center;justify-items:center;padding:4px}
.boot-dot{width:4px;height:4px;border-radius:50%;background:rgba(108,99,255,.65);animation:dp 1.6s ease-in-out infinite alternate}
@keyframes dp{from{opacity:.3;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.boot-title{color:#fff;font-size:26px;font-weight:700;margin-bottom:6px}
.boot-sub{color:rgba(255,255,255,.3);font-size:12px;margin-bottom:28px}
.boot-status-txt{color:rgba(255,255,255,.4);font-size:12px;margin-bottom:10px;height:18px}
.boot-bar-wrap{width:240px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-bottom:8px}
.boot-bar{height:100%;width:0;background:linear-gradient(90deg,#6c63ff,#00d4aa);transition:width .12s linear}
.boot-pct-row{color:rgba(255,255,255,.35);font-size:11px;display:flex;justify-content:space-between;width:240px;margin-bottom:28px}
.boot-load-btn{background:linear-gradient(90deg,#6c63ff,#7c6fff);border:none;border-radius:30px;padding:12px 40px;color:#fff;font-size:14px;cursor:pointer;font-weight:500;opacity:0;transition:opacity .4s,transform .2s;transform:translateY(8px)}
.boot-load-btn.show{opacity:1;transform:translateY(0)}
.boot-load-btn:hover{filter:brightness(1.12)}
/* LOGIN */
#login-screen{position:absolute;inset:0;z-index:800;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 40%,#1a1040,#0d0d1a 60%,#0a0812);transition:opacity .5s,transform .5s}
#login-screen.out{opacity:0;transform:scale(1.04);pointer-events:none}
.login-card{background:rgba(16,14,32,.94);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:36px 40px;width:340px;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
.login-header{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px}
.login-title{color:#fff;font-size:20px;font-weight:600}
.login-form{display:flex;flex-direction:column;gap:12px}
.l-input{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.09);border-radius:30px;padding:12px 18px;color:#e8e8f0;font-size:13px;outline:none;transition:border-color .2s;user-select:text}
.l-input:focus{border-color:rgba(108,99,255,.7);background:rgba(108,99,255,.07)}
.l-input::placeholder{color:rgba(255,255,255,.28)}
.l-btn{background:linear-gradient(90deg,#6c63ff,#7c6fff);border:none;border-radius:30px;padding:12px;color:#fff;font-size:14px;cursor:pointer;transition:all .2s;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px}
.l-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.l-btn.sec{background:transparent;border:1.5px solid rgba(255,255,255,.12);color:rgba(232,232,240,.45)}
.l-btn.sec:hover{background:rgba(255,255,255,.06);color:#e8e8f0;transform:none}
.l-err{color:#ff5f5f;font-size:11px;text-align:center;height:14px}
.l-link{color:#6c63ff;font-size:12px;text-align:center;cursor:pointer;margin-top:4px}
.l-link:hover{text-decoration:underline}
.reg-title{color:#fff;font-size:16px;font-weight:600;text-align:center;margin-bottom:20px}
/* OS */
#os{width:100vw;height:100vh;position:relative;overflow:hidden;background:#e8eaf6;animation:osIn .8s cubic-bezier(.16,1,.3,1) both}
@keyframes osIn{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
#wallpaper{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#f6f5fa);background-size:cover;background-position:center;background-repeat:no-repeat}
/* HOME */
#home{position:absolute;inset:0 0 70px 0;overflow:hidden;z-index:1}
.icon-grid{position:absolute;inset:0}
.h-icon{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:10px 6px;border-radius:16px;width:96px;transition:background .15s;animation:iconPop .45s cubic-bezier(.34,1.56,.64,1) both}
.h-icon:hover{background:rgba(0,0,0,.06)}
@keyframes iconPop{from{opacity:0;transform:scale(.4) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
.h-icon .ico-wrap{width:69px;height:69px;border-radius:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12);background:#fff}
.h-icon .lbl{color:#1a1a2e;font-size:11px;text-align:center;line-height:1.3;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-icon{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:8px 4px;border-radius:12px;width:100%;transition:background .15s;flex-shrink:0}
.drawer-icon:hover{background:rgba(0,0,0,.06)}
.drawer-icon .ico-wrap{width:52px;height:52px;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.1);background:#fff}
.drawer-icon .lbl{color:#1a1a2e;font-size:10px;text-align:center;line-height:1.3;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* SHELF */
#shelf{position:absolute;left:50%;bottom:36px;z-index:100;transform:translateX(-50%) translateY(90px);display:inline-flex;align-items:center;gap:8px;padding:10px 14px;transform-origin:center bottom;scale:0.82;background:rgba(42,48,68,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:999px;box-shadow:0 12px 36px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.05);opacity:0;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s;pointer-events:none;white-space:nowrap;}
#shelf.visible{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.shelf-apps-btn{width:48px;height:48px;border:none;border-radius:50%;background:#6366f1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 0 24px rgba(99,102,241,.45);transition:all .2s;}
.shelf-apps-btn:hover{background:#7275ff;transform:scale(1.05);}
.shelf-sep{width:1px;height:36px;margin:0 2px;background:rgba(255,255,255,.12);flex-shrink:0;}
#shelf-wins{display:inline-flex;align-items:center;gap:8px;}
.shelf-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4);margin:0 4px;transition:background .3s;}
.shelf-win-btn{width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.shelf-win-btn:hover,.shelf-win-btn.active{background:rgba(255,255,255,.18);}
.shelf-win-btn.minimized{opacity:.5;}
@keyframes statusDotPulse{0%,100%{background:rgba(34,197,94,.9);box-shadow:0 0 6px rgba(34,197,94,.5)}50%{background:rgba(34,197,94,.25);box-shadow:0 0 2px rgba(34,197,94,.2)}}
#status-dot.running{animation:statusDotPulse 1.4s ease-in-out infinite;}
#shelf-clock{color:#fff;font-size:20px;font-weight:600;letter-spacing:.03em;min-width:88px;height:48px;display:flex;align-items:center;justify-content:center;padding:0 10px;flex-shrink:0;}
/* DRAWER */
#app-drawer{position:absolute;bottom:118px;left:50%;transform:translateX(-50%) translateY(12px);z-index:50;background:#f5f5f7;border-radius:20px;padding:16px 16px 12px;box-shadow:0 24px 64px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.06);width:500px;max-height:540px;display:none;flex-direction:column;animation:drawerIn .2s cubic-bezier(.16,1,.3,1)}
#app-drawer.open{display:flex}
@keyframes drawerIn{from{opacity:0;transform:translateX(-50%) translateY(20px) scale(.97)}to{opacity:1;transform:translateX(-50%) translateY(12px) scale(1)}}
.drawer-search-row{width:100%;margin-bottom:14px}
.drawer-search{width:100%;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:9px 16px;font-size:13px;outline:none;color:#1a1a2e;user-select:text;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.drawer-search::placeholder{color:rgba(26,26,46,.35)}
.drawer-search:focus{border-color:rgba(108,99,255,.5);background:#fff}
.drawer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;overflow-y:auto;width:100%}
.drawer-close{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.07);border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;color:#555;font-size:14px;display:flex;align-items:center;justify-content:center}
/* WINDOWS */
#windows{position:absolute;inset:0;pointer-events:none;z-index:10}
/* CUSTOM MODAL */
.cm-overlay{position:fixed;inset:0;z-index:99998;background:rgba(15,15,25,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px);animation:cmFadeIn .15s;padding:20px;box-sizing:border-box}
.cm-overlay.closing{animation:cmFadeOut .14s both}
@keyframes cmFadeIn{from{opacity:0}to{opacity:1}}
@keyframes cmFadeOut{from{opacity:1}to{opacity:0}}
.cm-box{background:#fff;border-radius:16px;padding:22px 22px 18px;width:340px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:cmPop .18s cubic-bezier(.34,1.56,.64,1) both}
@keyframes cmPop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.cm-msg{font-size:13px;color:#1f2937;line-height:1.6;margin-bottom:14px}
.cm-input{width:100%;box-sizing:border-box;border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;font-size:13px;outline:none;margin-bottom:16px;user-select:text}
.cm-input:focus{border-color:#6c63ff}
.cm-actions{display:flex;justify-content:flex-end;gap:8px}
.cm-btn{border:none;border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-weight:500}
.cm-cancel{background:#f3f4f6;color:#374151}
.cm-ok{background:#6c63ff;color:#fff}
.vos-gloading{position:fixed;inset:0;z-index:99996;background:rgba(15,15,25,.35);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.vos-gloading.show{opacity:1}
.vos-gloading-box{background:#fff;border-radius:16px;padding:26px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.vos-gloading-spinner{width:30px;height:30px;border-radius:50%;border:3px solid #e5e7eb;border-top-color:#6c63ff;animation:bspin .7s linear infinite}
.vos-gloading-msg{font-size:12px;color:#374151;font-weight:500}
@keyframes asPulse{0%{box-shadow:0 0 0 0 rgba(108,99,255,.5);transform:scale(1)}30%{box-shadow:0 0 0 8px rgba(108,99,255,0);transform:scale(1.02)}100%{box-shadow:0 0 0 0 rgba(108,99,255,0);transform:scale(1)}}
.as-pulse{animation:asPulse .6s ease-out}
.vos-toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(12px);background:#1f2937;color:#fff;font-size:12px;font-weight:500;padding:10px 20px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:99997;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.vos-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.as-tag-chip{border:1.5px solid #e5e7eb;background:#f9fafb;color:#374151;border-radius:999px;padding:7px 16px;font-size:12px;cursor:pointer;transition:all .12s;user-select:none;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.as-mode-tab{color:#6b7280;transition:background .12s,color .12s}
.as-mode-tab.active{background:#fff;color:#1f2937;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.as-tag-chip:hover{border-color:#c7c5ff}
.as-tag-chip.selected{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:600}
.win{position:absolute;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.18);min-width:280px;min-height:180px;display:flex;flex-direction:column;overflow:hidden;animation:winIn .32s cubic-bezier(.16,1,.3,1) both;pointer-events:auto}
.win.win-anim{transition:left .3s cubic-bezier(.4,0,.2,1),top .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1),height .3s cubic-bezier(.4,0,.2,1),border-radius .3s cubic-bezier(.4,0,.2,1)}
@keyframes winIn{from{opacity:0;transform:scale(.72) translateY(-28px)}to{opacity:1;transform:none}}
.win.hidden{display:none}
.win.closing{animation:winOut .2s ease-in forwards}
@keyframes winOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.82)}}
.win-dark .wcontent{background:#111}
.win-dark .titlebar{background:#1c1c2e;border-bottom-color:rgba(255,255,255,.08)}
.win-dark .wtitle{color:#e8e8f0}
.titlebar{height:34px;background:rgba(245,245,250,.95);border-bottom:1px solid rgba(0,0,0,.08);display:flex;align-items:center;padding:0 12px;cursor:grab;flex-shrink:0}
.titlebar:active{cursor:grabbing}
.wtitle{color:#1a1a2e;font-size:12px;display:flex;align-items:center;gap:7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1;min-width:0}
.win-btns{margin-left:auto;display:flex;gap:6px;align-items:center;flex-shrink:0}
.wbtn{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer}
.wbtn.mini{background:#ffc94d}.wbtn.maxi{background:#5dde7a}.wbtn.close{background:#ff5f5f}
.wcontent{flex:1;overflow:auto;background:#fff}
.app-col{height:100%;display:flex;flex-direction:column;background:#fff}
/* inner styles */
.term{background:#08080f;color:#00ff88;font-family:'Courier New',monospace;font-size:12px;padding:10px;height:100%;overflow-y:auto;line-height:1.75}
.t-prompt{color:#00d4aa;font-weight:700}
.term-in{background:transparent;border:none;color:#00ff88;font-family:inherit;font-size:inherit;outline:none;flex:1;min-width:0;user-select:text}
.in-row{display:flex;align-items:center;gap:4px;padding:4px 10px;background:#08080f;border-top:1px solid rgba(255,255,255,.06)}
.etb{background:#1e1e2e;border-bottom:1px solid #333;padding:0 8px;display:flex;gap:0;flex-shrink:0;align-items:stretch;overflow-x:auto}
.ed-tab{padding:8px 14px;font-size:12px;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px}
.ed-tab.active{color:#e8e8f0;border-bottom-color:#6c63ff}
.ed-tab:hover{color:#c4b5fd}
.ed-toolbar{background:#1c1c2e;border-bottom:1px solid #2a2a3e;padding:4px 8px;display:flex;gap:4px;flex-shrink:0;align-items:center}
.ebtn{background:transparent;border:1px solid transparent;color:#ccc;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer}
.ebtn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25)}
.ebtn.run{background:#16a34a;color:#fff;border-color:#16a34a}
.lang-sel{background:#333;border:1px solid #555;color:#ccc;border-radius:5px;padding:3px 8px;font-size:11px;outline:none}
.ed-body{display:flex;flex:1;overflow:hidden}
.ed-gutter{background:#1a1a2a;color:#555;font-family:'Courier New',monospace;font-size:12px;padding:8px 6px;text-align:right;line-height:1.75;min-width:34px;user-select:none;border-right:1px solid #333;overflow:hidden}
.ebody{width:100%;flex:1;background:#1e1e2e;border:none;outline:none;color:#d4d4d4;font-size:12px;padding:8px;resize:none;font-family:'Courier New',monospace;line-height:1.75;user-select:text;tab-size:2}
.ed-out{background:#0d0d15;border-top:1px solid #333;min-height:56px;max-height:110px;padding:8px;overflow-y:auto;font-family:'Courier New',monospace;font-size:11px;color:#00ff88;flex-shrink:0}
.fi-folder{width:56px;height:48px;background:#6c63ff;border-radius:6px 6px 4px 4px;position:relative;display:flex;align-items:center;justify-content:center}
.fi-folder::before{content:'';position:absolute;top:-8px;left:0;width:40%;height:10px;background:#6c63ff;border-radius:4px 4px 0 0}
.fi-img{width:56px;height:48px;background:#6c63ff;border-radius:6px;display:flex;align-items:center;justify-content:center}
.fi-doc{width:48px;height:56px;background:#6c63ff;border-radius:4px;display:flex;align-items:center;justify-content:center}
.ftb-btn{background:#f8f9fa;border:1px solid #e5e7eb;border-radius:20px;padding:8px 16px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:#374151;transition:background .12s;white-space:nowrap;font-weight:500}
.ftb-btn:hover{background:#f0f0f2}
.fhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f0f0f0;flex-shrink:0;background:#fff}
.fside{width:136px;flex-shrink:0;background:#f8f9fb;border-right:1px solid #f0f0f0;padding:14px 10px;overflow-y:auto}
.fside-title{font-size:10px;color:#9ca3af;font-weight:700;letter-spacing:.06em;padding:10px 8px 6px;text-transform:uppercase}
.fside-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:#374151;cursor:pointer;transition:background .12s;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fside-item:hover{background:#eef0f4}
.fside-item.active{background:#6c63ff;color:#fff;font-weight:600}
.fside-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.fhead-path{font-size:14px;font-weight:600;color:#1f2937;flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.fhead-path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fhead-count{font-size:11px;color:#9ca3af;flex-shrink:0;background:#f8f9fa;padding:3px 9px;border-radius:20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:18px}
.fi{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:12px;cursor:pointer;transition:background .14s,transform .14s}
.fi:hover{background:rgba(108,99,255,.07);transform:translateY(-1px)}
.fi:active{transform:translateY(0) scale(.97)}
.fi-name{color:#374151;font-size:11.5px;text-align:center;word-break:break-word;line-height:1.35;max-width:84px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fi-del{position:absolute;top:4px;right:10px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid #fecaca;color:#dc2626;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s,background .12s;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.fi:hover .fi-del{opacity:1}
.fi-del:hover{background:#fee2e2}
.finfo-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #f5f5f5;font-size:12.5px}
.finfo-row .fi-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.finfo-label{color:#6b7280;flex:1}
.finfo-val{color:#1f2937;font-weight:600}
.bbar{background:#f8f9fa;border-bottom:1px solid #e5e7eb;padding:5px 8px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.urlbar{flex:1;background:#e8eaed;border:none;border-radius:20px;padding:5px 14px;color:#202124;font-size:13px;outline:none;user-select:text}
.sbody{flex:1;padding:14px;overflow-y:auto}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #e5e7eb}
.slabel{color:#6b7280;font-size:12px}
.tog{width:36px;height:20px;background:#d1d5db;border-radius:10px;cursor:pointer;position:relative;transition:all .2s;border:none}
.tog.on{background:#6c63ff}

async function sha256Hex(str){
  try{
    var buf=new TextEncoder().encode(str);
    var hash=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }catch(e){
    var h=0;for(var i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}
    return 'fb_'+Math.abs(h).toString(16);
  }
}

async function onlineGet(key){
  if(_sbReady){
    try{
      var r=await _sbClient.from('dotos_kv').select('value').eq('key',key).maybeSingle();
      if(!r.error&&r.data)return r.data.value;
    }catch(e){}
  }
  try{var r2=await window.storage.get(key,true);return r2?JSON.parse(r2.value):null;}catch(e){}
  return null;
}
async function onlineSet(key,val){
  if(_sbReady){
    try{await _sbClient.from('dotos_kv').upsert({key:key,value:val});return;}catch(e){}
  }
  try{await window.storage.set(key,JSON.stringify(val),true);}catch(e){}
}

async function loadAccounts(){
  var data = await onlineGet('vos_accounts');
  if(Array.isArray(data) && data.length){
    accounts = data;
  } else {
    try {
      var local = localStorage.getItem('vos_accounts');
      if(local){
        var parsed = JSON.parse(local);
        if(Array.isArray(parsed) && parsed.length) accounts = parsed;
      }
    } catch(e){}
  }
  if(!accounts.length){
    accounts=[{user:'admin',pass:await sha256Hex('admin'),role:'特権管理者'}];
  }
  await saveAccounts();
}
async function saveAccounts(){
  await onlineSet('vos_accounts', accounts);

async function doRegister(){
  var u=(document.getElementById('reg-user').value||'').trim();
  var p=document.getElementById('reg-pass').value||'';
  var p2=document.getElementById('reg-pass2').value||'';
  var err=document.getElementById('reg-err');
  if(!u){if(err)err.textContent='ユーザー名を入力してください';return;}
  if(!p){if(err)err.textContent='パスワードを入力してください';return;}
  if(p!==p2){if(err)err.textContent='パスワードが一致しません';return;}
  if(err)err.textContent='';
  showGlobalLoading('アカウント作成中...');
  var fresh=await onlineGet('vos_accounts');
  if(Array.isArray(fresh)&&fresh.length)accounts=fresh;
  if(accounts.find(function(a){return a.user===u;})){hideGlobalLoading();if(err)err.textContent='そのユーザー名は使用中です';return;}
  accounts.push({user:u,pass:await sha256Hex(p),role:'ユーザー'});
  await saveAccounts();
  setTimeout(function(){
    currentUser=accounts.find(function(a){return a.user===u;});
    termPromptUser=u;
    setWallpaper('gradient','linear-gradient(160deg,#f6f5fa)',null);
    var ls=document.getElementById('login-screen');

    setTimeout(function(){
      ls.style.display='none';
      renderHomeIcons();
      applySavedSettings();
      updateShelfVisibility();
      hideGlobalLoading();
    },600);
  },500);
}

var iconPositions={};
var TILE_W=109,TILE_H=121,ICON_W=96,ICON_H=105,ICON_PAD=34;
function gridCols(){return Math.max(1,Math.floor((osEl.offsetWidth-ICON_PAD)/TILE_W));}
function gridRows(){return Math.max(1,Math.floor((osEl.offsetHeight-80-ICON_PAD)/TILE_H));}
function cellToPx(col,row){return{x:ICON_PAD+col*TILE_W,y:ICON_PAD+row*TILE_H};}
function pxToCell(x,y){return{col:Math.round((x-ICON_PAD)/TILE_W),row:Math.round((y-ICON_PAD)/TILE_H)};}
function occupiedCellMap(excludeId){
  var occ={};
  Object.keys(iconPositions).forEach(function(oid){
    if(oid===excludeId)return;
    var p=iconPositions[oid];
    occ[p.col+','+p.row]=true;
  });
  return occ;
}
function findFreeCell(excludeId,col,row){
  var maxCols=gridCols(),maxRows=gridRows();
  var occ=occupiedCellMap(excludeId);
  function free(c,r){return c>=0&&c<maxCols&&r>=0&&r<maxRows&&!occ[c+','+r];}
  if(free(col,row))return{col:col,row:row};
  for(var c=col;c<maxCols;c++){
    var startR=(c===col)?row+1:0;
    for(var r=startR;r<maxRows;r++){
      if(free(c,r))return{col:c,row:r};
    }
  }
  for(var c2=0;c2<maxCols;c2++){
    for(var r2=0;r2<maxRows;r2++){
      if(free(c2,r2))return{col:c2,row:r2};
    }
  }
  return{col:col,row:row};
}

function findNextEmptyCell(excludeId){
  var maxCols=gridCols(),maxRows=gridRows();
  var occ=occupiedCellMap(excludeId);
  for(var c=0;c<maxCols;c++){
    for(var r=0;r<maxRows;r++){
      if(!occ[c+','+r])return{col:c,row:r};
    }
  }
  return{col:0,row:0};
}

function startIconDrag(e,id,el){
  var startX=e.clientX,startY=e.clientY;
  var startElX=parseInt(el.style.left)||0,startElY=parseInt(el.style.top)||0;
  var moved=false,ghost=null;
  function onMove(ev){
    var dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(!moved&&Math.sqrt(dx*dx+dy*dy)<6)return;
    if(!moved){moved=true;el.style.visibility='hidden';ghost=el.cloneNode(true);ghost.style.cssText='position:fixed;pointer-events:none;z-index:9000;width:80px;opacity:.85;transform:scale(1.1);transition:none;animation:none';document.body.appendChild(ghost);}
    if(ghost){ghost.style.left=(ev.clientX-40)+'px';ghost.style.top=(ev.clientY-44)+'px';}
  }
  function onUp(ev){
    document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
    if(ghost)ghost.remove();el.style.visibility='';
    if(moved){
      var dropX=startElX+(ev.clientX-startX),dropY=startElY+(ev.clientY-startY);
      var cell=pxToCell(dropX,dropY);
      cell.col=Math.max(0,Math.min(cell.col,gridCols()-1));
      cell.row=Math.max(0,Math.min(cell.row,gridRows()-1));
      var free=findFreeCell(id,cell.col,cell.row);
      var px=cellToPx(free.col,free.row);
      el.style.left=px.x+'px';el.style.top=px.y+'px';
      iconPositions[id]={col:free.col,row:free.row};saveIconPos();
    }
  }
  document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
}

async function changePw(){
  var cur=document.getElementById('pw-cur')&&document.getElementById('pw-cur').value||'';
  var nw=document.getElementById('pw-new')&&document.getElementById('pw-new').value||'';
  var nw2=document.getElementById('pw-new2')&&document.getElementById('pw-new2').value||'';
  var err=document.getElementById('pw-err');if(!currentUser)return;
  var hashedCur=await sha256Hex(cur);
  if(hashedCur!==currentUser.pass){if(err)err.textContent='現在のパスワードが違います';return;}
  if(!nw){if(err)err.textContent='新しいパスワードを入力';return;}
  if(nw!==nw2){if(err)err.textContent='パスワードが一致しません';return;}
  var hashedNew=await sha256Hex(nw);
  currentUser.pass=hashedNew;var i=accounts.findIndex(function(a){return a.user===currentUser.user;});if(i>=0)accounts[i].pass=hashedNew;await saveAccounts();
  if(err){err.style.color='#16a34a';err.textContent='変更しました！';setTimeout(function(){err.textContent='';err.style.color='#dc2626';},2000);}
}

function customModal(innerHtml,onMount){
  return new Promise(function(resolve){
    var overlay=document.createElement('div');
    overlay.className='cm-overlay';
    overlay.innerHTML='<div class="cm-box">'+innerHtml+'</div>';
    document.body.appendChild(overlay);
    function close(val){overlay.classList.add('closing');setTimeout(function(){overlay.remove();},140);resolve(val);}
    overlay.addEventListener('mousedown',function(e){if(e.target===overlay)close(false);});
    if(onMount)onMount(overlay,close);

function customPrompt(message,defaultValue){
  return customModal(
    '<div class="cm-msg">'+escH(message).replace(/\n/g,'<br>')+'</div>'
    +'<input class="cm-input" value="'+escH(defaultValue||'')+'">'
    +'<div class="cm-actions"><button class="cm-btn cm-cancel">キャンセル</button><button class="cm-btn cm-ok">OK</button></div>',
    function(overlay,close){

      setTimeout(function(){input.focus();input.select();},60);
      overlay.querySelector('.cm-cancel').onclick=function(){close(null);};
      overlay.querySelector('.cm-ok').onclick=function(){close(input.value);};
      input.addEventListener('keydown',function(e){

    }
  );

var TELL_KEY='vos_tell_messages';

async function tellLoad(){
  var data=await onlineGet(TELL_KEY);
  if(!Array.isArray(data)){
    try{data=JSON.parse(localStorage.getItem('vos_tell_local')||'null');}catch(e){data=null;}
  }

}
async function tellSave(msgs){
  if(msgs.length>200)msgs=msgs.slice(-200);

  await onlineSet(TELL_KEY,msgs);
}
function tellVisible(m){
  var me=(currentUser&&currentUser.user)||'';
  var role=(currentUser&&currentUser.role)||'';
  if(role==='特権管理者')return true;
  if(m.to&&m.to.toLowerCase()==='all')return true;
  if(m.from===me)return true;
  if(m.to===me)return true;
  return false;
}
function tellLine(m){
  var mine=m.from===((currentUser&&currentUser.user)||'');
  var nameColor=mine?'#00d4aa':'#6c63ff';
  var toLabel=(m.to&&m.to.toLowerCase()!=='all')?(' → '+escH(m.to)):' → 全員';
  var time=new Date(m.ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  return '<div style="margin-bottom:5px"><span style="color:'+nameColor+';font-weight:600">'+escH(m.from)+'</span><span style="color:rgba(255,255,255,.35);font-size:10px">'+toLabel+' · '+time+'</span><div style="color:#e8e8f0">'+escH(m.text)+'</div></div>';
}
async function tellRenderInitial(){
  var out=document.getElementById('term-out');if(!out)return;
  var msgs=await tellLoad();
  _termSeenCount=msgs.length;
  var visible=msgs.filter(tellVisible);
  if(visible.length){
    var box=document.createElement('div');
    box.id='term-tell-log';
    box.style.cssText='border-top:1px solid rgba(255,255,255,.08);margin:6px 0;padding-top:6px';
    box.innerHTML='<div style="color:rgba(255,255,255,.3);font-size:10px;margin-bottom:4px">📨 tell（直近'+Math.min(visible.length,15)+'件）</div>'+visible.slice(-15).map(tellLine).join('');
    out.appendChild(box);
    scrollTerm();
  }
  if(_termPollTimer)clearInterval(_termPollTimer);
  _termPollTimer=setInterval(tellPoll,4000);
}
async function tellPoll(){
  var out=document.getElementById('term-out');if(!out){if(_termPollTimer){clearInterval(_termPollTimer);_termPollTimer=null;}return;}
  var msgs=await tellLoad();
  if(msgs.length>_termSeenCount){
    var newOnes=msgs.slice(_termSeenCount).filter(tellVisible);
    _termSeenCount=msgs.length;
    if(newOnes.length){
      out.insertAdjacentHTML('beforeend',newOnes.map(tellLine).join(''));
      scrollTerm();
    }
  }
}
async function tellSend(target,text){
  var msgs=await tellLoad();
  var m={from:(currentUser&&currentUser.user)||'guest',to:target,text:text,ts:Date.now()};
  msgs.push(m);
  await tellSave(msgs);
  _termSeenCount=msgs.length;
  var out=document.getElementById('term-out');
  if(out){out.insertAdjacentHTML('beforeend',tellLine(m));scrollTerm();}
}

var termHistory=[],histIdx=-1;
function termKey(e){
  if(e.key==='Enter'){var i=document.getElementById('term-in');var cmd=i.value.trim();if(cmd){termHistory.unshift(cmd);histIdx=-1;}termRun(cmd);i.value='';}
  else if(e.key==='ArrowUp'){histIdx=Math.min(histIdx+1,termHistory.length-1);document.getElementById('term-in').value=termHistory[histIdx]||'';e.preventDefault();}
  else if(e.key==='ArrowDown'){histIdx=Math.max(histIdx-1,-1);document.getElementById('term-in').value=histIdx>=0?termHistory[histIdx]:'';e.preventDefault();}

async function termRun(cmd){
  var out=document.getElementById('term-out');var u=currentUser&&currentUser.user||'user';
  var echo='<div><span class="t-prompt">'+u+'@dotos:~$</span> <span style="color:#e8e8f0">'+escH(cmd)+'</span></div>';
  if(!cmd||!cmd.trim()){scrollTerm();return;}
  var trimmed=cmd.trim();
  var tellMatch=/^\/tell\s+(\S+)\s+([\s\S]+)$/i.exec(trimmed);
  if(tellMatch){
    out.innerHTML+=echo;scrollTerm();
    if(tellMatch[1].toLowerCase()==='all'&&!hasPerm('tell_all')){
      out.innerHTML+='<div style="color:#ff5f5f">/tell all は管理者・特権管理者のみ使用できます</div>';scrollTerm();return;
    }
    await tellSend(tellMatch[1],tellMatch[2]);
    return;
  }
  if(/^\/tell\b/i.test(trimmed)){
    out.innerHTML+=echo+'<div style="color:#ff5f5f">使い方: /tell ユーザー名 メッセージ　または　/tell all メッセージ</div>';scrollTerm();return;
  }
  var c=trimmed.toLowerCase();var resp='';
  if(c==='/help')resp='<div style="color:#ffd93d;line-height:1.9">'
    +'/ls — ファイル一覧<br>'
    +'/pwd — 現在のディレクトリ<br>'
    +'/whoami — ユーザー名を表示<br>'
    +'/id — ユーザー名と役職を表示<br>'
    +'/date — 現在日時を表示<br>'
    +'/uname — OS情報を表示<br>'
    +'/uptime — 稼働時間を表示<br>'
    +'/echo [文字列] — そのまま表示<br>'
    +'/clear — 画面をクリア<br>'
    +'/users — 登録ユーザー一覧<br>'
    +'/perms — 自分の権限一覧<br>'
    +'/tell [ユーザー名] [メッセージ] — 個人にメッセージ（送信者と相手だけに表示）<br>'
    +'/tell all [メッセージ] — 全員にメッセージ（管理者・特権管理者限定）'
    +'</div>';
  else if(c==='/ls')resp='<span style="color:#2dd4bf">ドキュメント/  ダウンロード/  画像/  app/  readme.txt</span>';
  else if(c==='/pwd')resp='/home/'+u;
  else if(c==='/whoami')resp=u;
  else if(c==='/id')resp=u+' ('+((currentUser&&currentUser.role)||'ゲスト')+')';
  else if(c==='/perms')resp=(PERMS[(currentUser&&currentUser.role)||'ゲスト']||[]).join(', ')||'なし';
  else if(c==='/date')resp=new Date().toLocaleString('ja-JP');
  else if(c==='/uname'||c==='/uname -a')resp='DotOS 4.0.0 x86_64';
  else if(c==='/uptime')resp='稼働時間: '+Math.floor(Math.random()*60+1)+'分';
  else if(c==='/users')resp=accounts.map(function(a){return a.user+' ('+a.role+')';}).join('<br>');
  else if(c==='/clear'){out.innerHTML='';return;}
  else if(c==='/echo')resp='';
  else if(c.indexOf('/echo ')===0)resp=escH(cmd.trim().slice(6));
  else resp='<span style="color:#ff5f5f">コマンドが見つかりません: '+escH(cmd)+'（例: /help）</span>';
  out.innerHTML+=echo+'<div style="margin-bottom:4px">'+resp+'</div>';scrollTerm();
}

function edAutoSave(){

    if(ind){ind.textContent='✓ 保存済み';ind.style.color='#00d4aa';setTimeout(function(){ind.textContent='自動保存ON';ind.style.color='#555';},1000);}
  },800);
}
function edKeydown(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();edSave();return;}
  if(e.key==='Tab'){
    e.preventDefault();
    var t=e.target;var s=t.selectionStart;
    t.value=t.value.slice(0,s)+'  '+t.value.slice(t.selectionEnd);
    t.selectionStart=t.selectionEnd=s+2;
    edOnInput();
  }
}

async function edSaveToFiles(){
  var ta=document.getElementById('editor-ta');if(ta)edState[_edCodeTab]=ta.value;
  if(!edState.html.trim()&&!edState.css.trim()&&!edState.js.trim()){await customConfirm('コードを入力してください');return;}
  var bundled='<!DOCTYPE html><html><head><style>'+edState.css+'</style></head><body>'+edState.html+'<script>'+edState.js+'<\/script></body></html>';
  var u=currentUser&&currentUser.user||'guest';
  var key='vos_appfiles_'+u;
  var files=[];try{files=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}
  var defName='untitled.html';
  var name=await customPrompt('ファイル名を入力してください（HTML・CSS・JavaScriptをまとめて1つのアプリとして保存します）',defName);
  if(!name||!name.trim())return;
  name=name.trim();
  var idx=files.findIndex(function(f){return f.name===name;});
  if(idx>=0){if(!(await customConfirm('"'+name+'" は既に存在します。上書きしますか？')))return;files.splice(idx,1);}
  files.push({name:name,lang:'html',code:bundled,created:Date.now()});
  localStorage.setItem(key,JSON.stringify(files));
  var out=document.getElementById('ed-out');
  if(out){out.style.display='block';out.innerHTML='<span style="color:#00ff88;font-size:11px">✓ ファイルアプリの app/ に保存しました（HTML+CSS+JS一式） → 「'+escH(name)+'」</span>';}
  setTimeout(function(){if(out)out.style.display='none';},2600);
  showToast('✓ 保存しました');

async function deleteAppFile(name){
  if(!(await customConfirm('「'+name+'」を削除しますか？')))return;
  closeFilesPreview();
  saveAppFiles(getAppFiles().filter(function(f){return f.name!==name;}));
  refreshFilesApp();

async function renameAppFile(oldName){
  var files=getAppFiles();
  var f=files.find(function(x){return x.name===oldName;});if(!f)return;
  var newName=await customPrompt('新しいファイル名',oldName);
  if(!newName||!newName.trim()||newName.trim()===oldName)return;
  newName=newName.trim();
  if(files.some(function(x){return x.name===newName;})){await customConfirm('「'+newName+'」は既に存在します');return;}
  f.name=newName;

  closeFilesPreview();

}

function buildCalc(){
  var keys=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','＋','0','·','.',  '＝'];
  var btns=keys.map(function(k,i){
    var acc=['÷','×','−','＋','＝'].indexOf(k)>=0;var wide=k==='0';
    return '<button onclick="calcKey(\''+k+'\')" style="grid-column:'+(wide?'span 2':'span 1')+';background:'+(acc?'#6c63ff':k==='C'?'#374151':'#2a2a3e')+';color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;padding:10px 0" onmouseover="this.style.filter=\'brightness(1.2)\'" onmouseout="this.style.filter=\'\'">'+k+'</button>';
  }).join('');
  return '<div style="background:#1c1c2e;height:100%;display:flex;flex-direction:column;padding:12px;gap:8px">'
    +'<div id="calc-disp" style="background:#111;border-radius:8px;padding:14px 16px;color:#fff;font-size:36px;font-weight:300;text-align:right;min-height:68px;font-family:monospace;word-break:break-all;line-height:1.2">0</div>'
    +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1">'+btns+'</div></div>';
}
var calcS={cur:'0',prev:null,op:null,reset:false};
function calcKey(k){
  var d=document.getElementById('calc-disp');if(!d)return;var s=calcS;
  if(k==='C'){s.cur='0';s.prev=null;s.op=null;s.reset=false;}
  else if(k==='±'){s.cur=String(parseFloat(s.cur)*-1);}
  else if(k==='%'){s.cur=String(parseFloat(s.cur)/100);}
  else if(['÷','×','−','＋'].indexOf(k)>=0){s.prev=parseFloat(s.cur);s.op=k;s.reset=true;}
  else if(k==='＝'){if(s.op&&s.prev!==null){var a=s.prev,b=parseFloat(s.cur);var r=s.op==='÷'?a/b:s.op==='×'?a*b:s.op==='−'?a-b:a+b;s.cur=String(parseFloat(r.toFixed(10)));s.op=null;s.prev=null;s.reset=false;}}
  else if(k==='.'){if(s.reset){s.cur='0.';s.reset=false;}else if(s.cur.indexOf('.')<0)s.cur+='.';}
  else if(k!=='·'){if(s.cur==='0'||s.reset){s.cur=k;s.reset=false;}else s.cur+=k;}
  d.textContent=s.cur.length>10?parseFloat(s.cur).toExponential(4):s.cur;
}

function asSetPublishMode(mode){
  var codeTab=document.getElementById('as-mode-code'),linkTab=document.getElementById('as-mode-link');
  var codeFields=document.getElementById('as-code-fields'),codeFields2=document.getElementById('as-code-fields2'),linkFields=document.getElementById('as-link-fields');
  var err=document.getElementById('as-up-err');if(err)err.textContent='';
  if(mode==='link'){
    if(codeTab)codeTab.classList.remove('active');if(linkTab)linkTab.classList.add('active');
    if(codeFields)codeFields.style.display='none';if(codeFields2)codeFields2.style.display='none';if(linkFields)linkFields.style.display='block';
  }else{
    if(linkTab)linkTab.classList.remove('active');if(codeTab)codeTab.classList.add('active');
    if(codeFields)codeFields.style.display='block';if(codeFields2)codeFields2.style.display='block';if(linkFields)linkFields.style.display='none';
  }
}
function asGoToTagStep(){
  var name=(document.getElementById('as-up-name')&&document.getElementById('as-up-name').value||'').trim();
  var isLinkMode=document.getElementById('as-link-fields')&&document.getElementById('as-link-fields').style.display!=='none';
  var err=document.getElementById('as-up-err');
  if(!name){if(err)err.textContent='アプリ名を入力してください';return;}
  if(isLinkMode){
    var url=(document.getElementById('as-up-url')&&document.getElementById('as-up-url').value||'').trim();
    if(!url){if(err)err.textContent='URLを入力してください';return;}
    if(!/^https?:\/\//i.test(url)){if(err)err.textContent='URLは http:// または https:// から始めてください';return;}
  }else{
    var code=(document.getElementById('as-up-code')&&document.getElementById('as-up-code').value||'').trim();
    if(!code){if(err)err.textContent='コードを入力してください';return;}
  }
  if(err)err.textContent='';
  var s1=document.getElementById('as-step1'),s2=document.getElementById('as-step2');
  if(s1)s1.style.display='none';
  if(s2)s2.style.display='flex';
}
function asBackToFormStep(){
  var s1=document.getElementById('as-step1'),s2=document.getElementById('as-step2');
  if(s2)s2.style.display='none';
  if(s1)s1.style.display='flex';
}
function asToggleTagChip(el){el.classList.toggle('selected');}
function asPickFile(name){
  var f=getAppFiles().find(function(x){return x.name===name;});if(!f)return;
  var nameInput=document.getElementById('as-up-name');
  var langSel=document.getElementById('as-up-lang');
  var codeTa=document.getElementById('as-up-code');
  if(nameInput&&!nameInput.value.trim()){nameInput.value=f.name.replace(/\.[^.]+$/,'');}
  if(langSel)langSel.value=f.lang==='javascript'?'javascript':'html';
  if(codeTa)codeTa.value=f.code;
  document.querySelectorAll('.as-file-pick').forEach(function(el){
    var picked=el.getAttribute('data-name')===name;
    el.style.borderColor=picked?'#6c63ff':'#e5e7eb';
    el.style.background=picked?'rgba(108,99,255,.06)':'';
  });
}
async function doAppStoreUpload2(){
  var name=(document.getElementById('as-up-name')&&document.getElementById('as-up-name').value||'').trim();
  var desc=(document.getElementById('as-up-desc')&&document.getElementById('as-up-desc').value||'').trim();
  var tags=Array.from(document.querySelectorAll('.as-tag-chip.selected')).map(function(el){return el.getAttribute('data-tag');});
  var isLinkMode=document.getElementById('as-link-fields')&&document.getElementById('as-link-fields').style.display!=='none';
  var entry;
  if(isLinkMode){
    var url=(document.getElementById('as-up-url')&&document.getElementById('as-up-url').value||'').trim();
    if(!name||!url)return;
    entry={lang:'link',url:url,code:''};
  }else{
    var lang=(document.getElementById('as-up-lang')&&document.getElementById('as-up-lang').value)||'html';
    var code=(document.getElementById('as-up-code')&&document.getElementById('as-up-code').value||'').trim();
    if(!name||!code)return;
    entry={lang:lang,code:code};
  }
  var btn=document.getElementById('as-final-publish-btn');
  if(btn){btn.disabled=true;btn.textContent='公開中...';}
  var apps=getStoreAppsSync();
  var id='uapp_'+Date.now();
  apps.push(Object.assign({id:id,name:name,desc:desc,tags:tags,author:currentUser&&currentUser.user,dl:0,rating:0,uploadedAt:new Date().toISOString()},entry));
  await saveStoreApps(apps);
  renderHomeIcons();renderDrawerIcons();
  var wc=document.getElementById('wc-appstore');
  if(wc){wc.innerHTML=buildAppStore();}
  showToast('🚀 公開しました！');
  var newCard=document.getElementById('as-card-'+id);
  if(newCard)pulseCard(newCard);
}
async function delStoreApp(id){
  if(!hasPerm('app_delete')){await customConfirm('削除権限がありません');return;}
  if(!(await customConfirm('このアプリを削除しますか？')))return;
  await saveStoreApps(getStoreAppsSync().filter(function(a){return a.id!==id;}));
  renderHomeIcons();var wc=document.getElementById('wc-appstore');if(wc)wc.innerHTML=buildAppStore();
  showToast('✓ 削除しました');
}
function buildUserApp(sd){
  if(!sd)return '<div style="padding:16px">エラー</div>';
  if(sd.lang==='link'){
    return '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f9fafb;padding:20px;text-align:center">'
      +'<div style="width:64px;height:64px;border-radius:18px;background:#6c63ff;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;box-shadow:0 8px 24px rgba(108,99,255,.3)">🔗</div>'
      +'<div style="font-size:16px;font-weight:700;color:#1f2937">'+escH(sd.name)+'</div>'
      +(sd.desc?'<div style="font-size:12px;color:#6b7280;max-width:320px;line-height:1.6">'+escH(sd.desc)+'</div>':'')
      +'<a href="'+escH(sd.url||'')+'" target="_blank" rel="noopener noreferrer" style="background:#6c63ff;color:#fff;text-decoration:none;border-radius:20px;padding:11px 26px;font-size:13px;font-weight:600;box-shadow:0 4px 14px rgba(108,99,255,.35)">🚀 新しいタブで起動</a>'
      +'<div style="font-size:10px;color:#9ca3af;max-width:300px;line-height:1.5">このアプリは容量が大きいため、DotOSには埋め込まず外部リンクとして起動します</div>'
      +'</div>';
  }
  if(sd.lang==='html'){
    return '<iframe srcdoc="'+escH(sd.code)+'" style="width:100%;height:100%;border:none;display:block"></iframe>';
  }
  if(sd.lang==='javascript'){
    var appId='uapp_run_'+sd.id;
    var logs=[];
    var fakeConsole={log:function(){logs.push(Array.from(arguments).map(function(a){try{return typeof a==='object'?JSON.stringify(a,null,2):String(a);}catch(e){return String(a);}}).join(' '));},
      error:function(){logs.push('<span style="color:#ff5f5f">'+Array.from(arguments).join(' ')+'</span>');},
      warn:function(){logs.push('<span style="color:#ffd93d">'+Array.from(arguments).join(' ')+'</span>');}};
    var resultHtml='';
    try{var fn=new Function('console',sd.code);fn(fakeConsole);
      resultHtml=logs.length?logs.map(function(l){return '<div>'+l+'</div>';}).join(''):'<span style="color:#6b7280;font-size:11px">（出力なし）</span>';
      resultHtml='<div style="color:#00ff88;font-size:11px;margin-bottom:6px">✓ 実行完了</div>'+resultHtml;
    }catch(err){resultHtml='<span style="color:#ff5f5f;font-size:11px">✗ エラー: '+escH(err.message)+'</span>';}
    return '<div style="height:100%;display:flex;flex-direction:column;background:#1e1e2e">'
      +'<div class="etb"><span style="color:#6c63ff;font-size:11px">'+escH(sd.name)+'</span>'
      +'<button class="ebtn run" style="margin-left:auto" onclick="rerunUserApp(\''+sd.id+'\')">▶ 再実行</button></div>'
      +'<div id="uapp-out-'+sd.id+'" style="flex:1;padding:12px;font-family:\'Courier New\',monospace;font-size:12px;line-height:1.7;color:#d4d4d4;overflow-y:auto">'+resultHtml+'</div></div>';
  }
  return '<div style="height:100%;display:flex;flex-direction:column;background:#1e1e2e">'
    +'<div class="etb"><span style="color:#6c63ff;font-size:11px">'+escH(sd.name)+' ('+escH(sd.lang)+')</span></div>'
    +'<div style="flex:1;padding:12px;overflow-y:auto"><pre style="font-family:\'Courier New\',monospace;font-size:12px;line-height:1.7;color:#d4d4d4;white-space:pre-wrap;user-select:text">'+escH(sd.code)+'</pre></div></div>';
}
function rerunUserApp(appId){
  var sd=getStoreAppsSync().find(function(a){return a.id===appId;});
  var out=document.getElementById('uapp-out-'+appId);if(!sd||!out)return;
  var logs=[];
  var fakeConsole={log:function(){logs.push(Array.from(arguments).map(function(a){try{return typeof a==='object'?JSON.stringify(a,null,2):String(a);}catch(e){return String(a);}}).join(' '));},
    error:function(){logs.push('<span style="color:#ff5f5f">'+Array.from(arguments).join(' ')+'</span>');},
    warn:function(){logs.push('<span style="color:#ffd93d">'+Array.from(arguments).join(' ')+'</span>');}};
  var resultHtml='';
  try{var fn=new Function('console',sd.code);fn(fakeConsole);
    resultHtml=logs.length?logs.map(function(l){return '<div>'+l+'</div>';}).join(''):'<span style="color:#6b7280;font-size:11px">（出力なし）</span>';
    resultHtml='<div style="color:#00ff88;font-size:11px;margin-bottom:6px">✓ 実行完了</div>'+resultHtml;
  }catch(err){resultHtml='<span style="color:#ff5f5f;font-size:11px">✗ エラー: '+escH(err.message)+'</span>';}
  out.innerHTML=resultHtml;
}
var _adminPollTimer=null;
async function refreshAdminUsers(btn){
  if(btn){btn.textContent='更新中...';btn.disabled=true;}
  await loadAccounts();
  var wc=document.getElementById('wc-admin');if(wc)wc.innerHTML=buildAdmin();
}
function startAdminPoll(){
  if(_adminPollTimer)clearInterval(_adminPollTimer);
  _adminPollTimer=setInterval(async function(){
    var wc=document.getElementById('wc-admin');
    if(!wc){clearInterval(_adminPollTimer);_adminPollTimer=null;return;}
    var before=JSON.stringify(accounts);
    await loadAccounts();
    if(JSON.stringify(accounts)!==before){wc.innerHTML=buildAdmin();}
  },5000);
}
function buildAdmin(){
  if(!hasPerm('admin_panel'))return '<div style="padding:20px;color:#dc2626">アクセス拒否: 管理者権限が必要です</div>';
  var canManageUsers=hasPerm('user_manage');
  var canDeleteApps=hasPerm('app_delete');
  var html='<div style="padding:16px 8px;overflow-y:auto;height:100%"><div style="font-size:16px;font-weight:600;color:#1f2937;margin-bottom:14px;padding:0 8px">🛡 管理者パネル</div>'
    +'<div class="adm-grid">'
    +'<div class="adm-sec"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><h4 style="margin:0">👥 ユーザー管理</h4><button onclick="refreshAdminUsers(this)" title="最新の登録アカウントを再取得" style="background:#fff;border:1px solid #fecaca;color:#dc2626;border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer">🔄 更新</button></div>'
    +(canManageUsers?'':'<div style="font-size:11px;color:#9ca3af;margin-bottom:8px">表示のみ（編集には特権管理者権限が必要です）</div>');
  accounts.forEach(function(a){
    var cls=a.role==='特権管理者'?'a':a.role==='管理者'?'m':'u';
    var isSelf=currentUser&&a.user===currentUser.user;
    html+='<div class="urow"><span style="font-size:13px;color:#374151;flex:1">'+escH(a.user)+'</span>'
      +'<span class="rbadge '+cls+'">'+a.role+'</span>';
    if(isSelf){
      html+='<span style="font-size:10px;color:#9ca3af;margin-left:8px">(自分)</span>';
    }else if(a.user==='admin'){
      html+='<span style="font-size:10px;color:#9ca3af;margin-left:8px">(保護)</span>';
    }else if(canManageUsers){
      html+='<select onchange="changeRole(\''+a.user+'\',this.value)" style="border:1px solid #fca5a5;border-radius:6px;padding:3px 6px;font-size:11px;color:#374151;background:#fff;margin-left:8px">'
        +['特権管理者','管理者','ユーザー','ゲスト'].map(function(r){return '<option value="'+r+'"'+(r===a.role?' selected':'')+'>'+r+'</option>';}).join('')
        +'</select>'
        +'<button onclick="deleteUser(\''+a.user+'\')" style="background:#fee2e2;border:1px solid #fca5a5;color:#dc2626;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;margin-left:6px">削除</button>';
    }
    html+='</div>';
  });
  html+='</div><div class="adm-sec"><h4>📦 App Store</h4>'
    +'<div style="font-size:12px;color:#374151;margin-bottom:8px">登録アプリ: '+getStoreAppsSync().length+'件</div>'
    +(canDeleteApps?'<button onclick="clearStore()" style="background:#fee2e2;border:1px solid #fca5a5;color:#dc2626;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px">全アプリ削除</button>':'')+'</div>'
    +'<div class="adm-sec" style="flex-basis:100%"><h4>🔐 ロール権限</h4>'
    +'<div class="adm-perm-grid">'
    +Object.keys(PERMS).map(function(r){return '<div><span class="rbadge '+(r==='特権管理者'?'a':r==='管理者'?'m':'u')+'" style="display:inline-block;margin-bottom:3px">'+r+'</span><div style="font-size:11px;color:#6b7280">'+(PERMS[r].join(' • ')||'なし')+'</div></div>';}).join('')
    +'</div>'
    +'</div></div></div>';
  return html;
}
async function changeRole(username,role){
  if(!hasPerm('user_manage')){await customAlert('権限がありません');return;}
  if(currentUser&&username===currentUser.user){await customAlert('自分自身の役職は変更できません');return;}
  var i=accounts.findIndex(function(a){return a.user===username;});if(i<0)return;
  accounts[i].role=role;await saveAccounts();var wc=document.getElementById('wc-admin');if(wc)wc.innerHTML=buildAdmin();
}
async function deleteUser(username){
  if(!hasPerm('user_manage')){await customAlert('権限がありません');return;}
  if(!(await customConfirm(username+' を削除しますか？')))return;
  accounts=accounts.filter(function(a){return a.user!==username;});await saveAccounts();
  var wc=document.getElementById('wc-admin');if(wc)wc.innerHTML=buildAdmin();
  if(currentUser&&currentUser.user===username){doLogout();}
}
async function clearStore(){
  if(!hasPerm('app_delete')){await customAlert('権限がありません');return;}
  if(!(await customConfirm('全アプリを削除しますか？')))return;
  await saveStoreApps([]);_storeCache=[];renderHomeIcons();var wc=document.getElementById('wc-admin');if(wc)wc.innerHTML=buildAdmin();
}
